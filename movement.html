<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📈 進出記錄 Movement · Bowen</title>
<style>
  :root{--brand:#7B5E3A;--brand2:#9C7B4F;--brandL:#F5EFE6;--bg:#FAF8F5;--card:#fff;
    --text:#2B2520;--text2:#6B6158;--text3:#9B9188;--line:#E8E0D6;
    --out:#7B5E3A;--in:#3E7C5A;--radius:14px;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;padding-bottom:40px}
  .top{background:var(--brand);color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:30;box-shadow:0 2px 12px rgba(0,0,0,.12)}
  .top h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
  .top .sub{font-size:12px;opacity:.85;margin-top:2px}
  .nav{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .nav a{font-size:12px;color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:5px 11px;border-radius:20px;font-weight:600}
  .nav a.active{background:#fff;color:var(--brand)}
  .wrap{max-width:900px;margin:0 auto;padding:14px}
  .search{position:sticky;top:96px;z-index:20;background:var(--bg);padding:6px 0 10px}
  .search input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:15px;background:#fff}
  .search input:focus{outline:none;border-color:var(--brand)}
  .stats{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
  .stat{flex:1;min-width:90px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .stat .n{font-size:19px;font-weight:800;color:var(--brand)}
  .stat .l{font-size:11px;color:var(--text2)}
  .legend{display:flex;gap:16px;margin:6px 2px 14px;font-size:12px;color:var(--text2)}
  .legend b{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-right:5px}
  .list{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:0 1px 4px rgba(0,0,0,.03)}
  .card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
  .card .sku{font-weight:800;color:var(--brand);font-size:15px}
  .card .nm{font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .tot{font-size:11px;color:var(--text3);margin-bottom:9px;display:flex;gap:14px}
  .card .tot .o b{color:var(--out)}.card .tot .i b{color:var(--in)}
  .chart{width:100%;height:80px;display:block}
  .chart .axis{stroke:var(--line);stroke-width:1}
  .bar-out{fill:var(--out);opacity:.85}
  .bar-in{fill:var(--in);opacity:.9}
  .yr{font-size:9px;fill:var(--text3)}
  .empty{text-align:center;padding:40px;color:var(--text3);font-size:14px}
  .more{text-align:center;padding:14px;color:var(--brand);font-weight:700;font-size:14px;cursor:pointer}
  .tip{font-size:11px;color:var(--text3);text-align:center;margin:2px 0 12px}
</style>
</head>
<body>
<div class="top">
  <h1>📈 進出記錄 Stock Movement</h1>
  <div class="sub">每月出貨(銷售) + 進貨(到櫃) · 42個月</div>
  <div class="nav">
    <a href="index.html">🧮 貨櫃</a>
    <a href="inventory.html">📊 庫存</a>
    <a href="quote.html">💰 報價</a>
    <a href="movement.html" class="active">📈 進出</a>
  </div>
</div>
<div class="wrap">
  <div class="search"><input type="text" id="q" placeholder="🔍 搜尋 SKU 或名稱… (如 T33B, GCL, 柱子)" autocomplete="off"></div>
  <div class="stats">
    <div class="stat"><div class="n" id="s-skus">–</div><div class="l">SKU 數量</div></div>
    <div class="stat"><div class="n" id="s-out">–</div><div class="l">總出貨 OUT</div></div>
    <div class="stat"><div class="n" id="s-in">–</div><div class="l">總進貨 IN</div></div>
  </div>
  <div class="legend">
    <span><b style="background:var(--out)"></b>出貨 Sold (OUT)</span>
    <span><b style="background:var(--in)"></b>進貨 Received (IN)</span>
  </div>
  <div class="tip">只顯示有記錄的 SKU · 進貨僅顯示有日期的貨櫃</div>
  <div style="display:flex;gap:8px;margin:0 2px 12px;font-size:12px">
    <button id="modeHist" onclick="setMode('hist')" style="flex:1;padding:8px;border:2px solid var(--brand);border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:12px">📦 歷史記錄 History</button>
    <button id="modeLive" onclick="setMode('live')" style="flex:1;padding:8px;border:2px solid var(--brand);border-radius:10px;background:#fff;color:var(--brand);font-weight:700;font-size:12px">📲 即時庫存 Live</button>
  </div>
  <div class="list" id="list"></div>
  <div class="more" id="more" style="display:none">顯示更多 ▾</div>
  <div class="empty" id="empty" style="display:none">找不到符合的 SKU</div>
</div>

let MONTHS = DATA.months;
let SKUS = DATA.skus;
const yearStartsFor = (mm)=> mm.map((m,i)=>({i,y:m.slice(0,4),mo:m.slice(5)})).filter(x=>x.mo==='01');
let mode = 'hist';
let LIVE = null;  // built on demand from inventory localStorage

function buildLive(){
  // Read the actual in/out you record in the inventory app (bpc_inv_hist)
  let hist=[];
  try{ hist = JSON.parse(localStorage.getItem('bpc_inv_hist')||'[]'); }catch(e){}
  // group by sku -> month -> {in, out}
  const bySku={};
  const monthsSet=new Set();
  hist.forEach(h=>{
    if(!h.sku||!h.date) return;
    const mo = h.date.slice(0,7);  // YYYY-MM
    monthsSet.add(mo);
    if(!bySku[h.sku]) bySku[h.sku]={};
    if(!bySku[h.sku][mo]) bySku[h.sku][mo]={in:0,out:0};
    const q = Math.abs(+h.qty||0);
    if(h.type==='in') bySku[h.sku][mo].in += q;
    else if(h.type==='out') bySku[h.sku][mo].out += q;
  });
  const months = [...monthsSet].sort();
  if(months.length===0) return {months:[],skus:{}};
  const skus={};
  Object.keys(bySku).forEach(sku=>{
    const out = months.map(m=> Math.round(bySku[sku][m]?.out||0));
    const inn = months.map(m=> Math.round(bySku[sku][m]?.in||0));
    if(out.reduce((a,b)=>a+b,0)===0 && inn.reduce((a,b)=>a+b,0)===0) return;
    skus[sku]={out,in:inn,total_out:out.reduce((a,b)=>a+b,0),total_in:inn.reduce((a,b)=>a+b,0)};
  });
  return {months,skus};
}
function activeData(){ return mode==='live' ? (LIVE||(LIVE=buildLive())) : DATA; }
function setMode(m){
  mode=m;
  document.getElementById('modeHist').style.background = m==='hist'?'var(--brand)':'#fff';
  document.getElementById('modeHist').style.color = m==='hist'?'#fff':'var(--brand)';
  document.getElementById('modeLive').style.background = m==='live'?'var(--brand)':'#fff';
  document.getElementById('modeLive').style.color = m==='live'?'#fff':'var(--brand)';
  if(m==='live') LIVE=buildLive();
  applyFilter();
}
let shown = 30, filtered = [];

function fmt(n){return n.toLocaleString()}
function allSkuList(){
  const ad=activeData(); MONTHS=ad.months; SKUS=ad.skus;
  return Object.keys(SKUS).sort((a,b)=>SKUS[b].total_out - SKUS[a].total_out);
}
function sparkline(sku){
  const d=SKUS[sku], out=d.out, inn=d.in;
  const n=MONTHS.length, W=100, H=80, pad=2;
  const yearStarts=yearStartsFor(MONTHS);
  const maxV=Math.max(1, ...out, ...inn);
  const bw=(W-pad*2)/n;
  let bars='';
  for(let i=0;i<n;i++){
    const x=pad+i*bw;
    const oh=(out[i]/maxV)*(H/2-4);
    const ih=(inn[i]/maxV)*(H/2-4);
    if(out[i]>0) bars+=`<rect class="bar-out" x="${x.toFixed(1)}" y="${(H/2-oh).toFixed(1)}" width="${(bw*.8).toFixed(1)}" height="${oh.toFixed(1)}"><title>${MONTHS[i]} 出 ${out[i]}</title></rect>`;
    if(inn[i]>0) bars+=`<rect class="bar-in" x="${x.toFixed(1)}" y="${(H/2).toFixed(1)}" width="${(bw*.8).toFixed(1)}" height="${ih.toFixed(1)}"><title>${MONTHS[i]} 進 ${inn[i]}</title></rect>`;
  }
  let yl='';
  yearStarts.forEach(ys=>{ const x=pad+ys.i*bw; yl+=`<text class="yr" x="${x.toFixed(1)}" y="78">${ys.y}</text>`; });
  return `<svg class="chart" viewBox="0 0 100 82" preserveAspectRatio="none">
    <line class="axis" x1="0" y1="${(H/2).toFixed(1)}" x2="100" y2="${(H/2).toFixed(1)}"/>
    ${bars}${yl}</svg>`;
}
function card(sku){
  const d=SKUS[sku];
  return `<div class="card">
    <div class="hd"><span class="sku">${sku}</span><span class="nm">${NAMES[sku]||''}</span></div>
    <div class="tot"><span class="o">出貨 <b>${fmt(d.total_out)}</b></span><span class="i">進貨 <b>${fmt(d.total_in)}</b></span></div>
    ${sparkline(sku)}
  </div>`;
}
function render(){
  const list=document.getElementById('list');
  const page=filtered.slice(0,shown);
  list.innerHTML=page.map(card).join('');
  document.getElementById('empty').style.display=filtered.length?'none':'block';
  document.getElementById('more').style.display=filtered.length>shown?'block':'none';
}
function applyFilter(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const all=allSkuList();
  const emptyEl=document.getElementById('empty');
  if(mode==='live' && all.length===0){
    document.getElementById('list').innerHTML='';
    emptyEl.style.display='block';
    emptyEl.textContent='還沒有即時庫存記錄。在「庫存管理」頁面入庫/出庫後，這裡會顯示。';
    document.getElementById('more').style.display='none';
    return;
  } else { emptyEl.textContent='找不到符合的 SKU'; }
  filtered = q ? all.filter(s=> s.toLowerCase().includes(q) || (NAMES[s]||'').toLowerCase().includes(q)) : all;
  shown=30; render();
}
document.getElementById('q').addEventListener('input', applyFilter);
document.getElementById('more').addEventListener('click', ()=>{shown+=30; render();});
// stats
function updateStats(){
  const ad=activeData(); let to=0,ti=0;
  Object.values(ad.skus).forEach(d=>{to+=d.total_out; ti+=d.total_in;});
  document.getElementById('s-skus').textContent=fmt(Object.keys(ad.skus).length);
  document.getElementById('s-out').textContent=fmt(to);
  document.getElementById('s-in').textContent=fmt(ti);
}
// wrap applyFilter to also refresh stats
const _applyFilter = applyFilter;
applyFilter = function(){ _applyFilter(); updateStats(); };
updateStats();
applyFilter();
